<span className="text-sm font-medium text-acc">${p[0]}</span><h3 className="mt-2 text-xl font-semibold tracking-tight">${p[1]}</h3><p className="mt-2 text-mute">${p[2]}</p>
${o===p[1]&&html`<p className="mt-4 pt-4 border-t border-line text-mute">${p[3]}</p>`}</button>`)}</div>`}

function Certs(){const[g,setG]=useState('All'),[q,setQ]=useState(''),[all,setAll]=useState(false);
const f=useMemo(()=>DATA.filter(x=>(g==='All'||grp(x.c)===g)&&(x.n+' '+IS[x.c]).toLowerCase().includes(q.toLowerCase().trim())),[g,q]);
const full=all||q||g!=='All',v=full?f:f.slice(0,12);
return html`<input type="search" value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Search by name or issuer, for example Kubernetes" aria-label="Search certifications" className="w-full max-w-lg rounded-full border border-line px-6 py-3.5 text-base"/>
<div className="mt-5"><${Chips} items=${GROUPS} value=${g} pick=${setG} count=${n=>n==='All'?DATA.length:DATA.filter(x=>grp(x.c)===n).length}/></div>
<p className="mt-6 mb-4 text-mute" aria-live="polite">${f.length} of ${DATA.length} certifications and badges</p>
<ul className="grid gap-3 md:grid-cols-2">${v.map(x=>html`<li key=${x.n+x.d+x.c} className="rounded-2xl border border-line bg-panel px-5 py-4"><b className="block font-semibold leading-snug">${x.n}</b><span className="text-sm text-mute">${IS[x.c]} \u00b7 ${x.d}</span></li>`)}</ul>
${!full&&f.length>12&&html`<button type="button" onClick=${()=>setAll(true)} className="mt-6 rounded-full border border-line px-6 py-3 font-medium hover:border-mute">Show all ${DATA.length}</button>`}`}

function Contact(){const[n,setN]=useState(''),[m,setM]=useState(''),[t,setT]=useState(''),[s,setS]=useState('');
const inp='w-full rounded-2xl border border-line px-5 py-3.5 text-base';
function send(){if(!n.trim()||!/^\S+@\S+\.\S+$/.test(m)||!t.trim()){setS('Please fill in your name, a valid email and a message.');return}
setS('Opening your email app. If nothing opens, write to '+EMAIL+'.');
window.location.href='mailto:'+EMAIL+'?subject='+encodeURIComponent('Portfolio message from '+n.trim())+'&body='+encodeURIComponent(t.trim()+'\n\n'+n.trim()+'\n'+m.trim())}
return html`<div className="grid gap-12 md:grid-cols-2">
<div className="space-y-4">
<label className="block text-sm font-medium">Name<input value=${n} onInput=${e=>setN(e.target.value)} autoComplete="name" className=${inp+' mt-2'}/></label>
<label className="block text-sm font-medium">Email<input type="email" value=${m} onInput=${e=>setM(e.target.value)} autoComplete="email" className=${inp+' mt-2'}/></label>
<label className="block text-sm font-medium">Message<textarea rows="5" value=${t} onInput=${e=>setT(e.target.value)} className=${inp+' mt-2'}></textarea></label>
<button type="button" onClick=${send} className="rounded-full px-7 py-3.5 font-semibold text-white bg-acc hover:opacity-90">Send message</button>
<p className="text-sm text-mute" role="status">${s}</p></div>
<div className="space-y-6 md:pl-8">
${[['Email',EMAIL,'mailto:'+EMAIL],['Phone',PHONE,'tel:+918807176739'],['LinkedIn','linkedin.com/in/zafar-riza',LI]].map(r=>html`<div key=${r[0]} className="border-b border-line pb-5"><p className="text-sm text-mute">${r[0]}</p><a className="text-xl font-medium hover:text-acc break-all" href=${r[2]} target=${r[0]==='LinkedIn'?'_blank':null} rel="noopener">${r[1]}</a></div>`)}
</div></div>`}

function App(){const[open,setOpen]=useState(false);
return html`<div>
<nav className="sticky z-20 border-b border-line backdrop-blur-xl" style=${{top:'env(safe-area-inset-top,0px)',background:'color-mix(in srgb,var(--bg) 80%,transparent)'}} aria-label="Main">
<div className="mx-auto max-w-6xl px-6 h-14 flex items-center justify-between"><a href="#top" className="font-semibold tracking-tight">Zafar Riza</a>
<div className="hidden md:flex gap-7 text-sm text-mute">${NAV.map(l=>html`<a key=${l[1]} href=${'#'+l[1]} className="hover:text-ink">${l[0]}</a>`)}</div>
<button type="button" className="md:hidden p-2 -mr-2" aria-label="Menu" aria-expanded=${open} onClick=${()=>setOpen(!open)}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d=${open?'M6 6l12 12M18 6L6 18':'M4 8h16M4 16h16'}/></svg></button></div>
${open&&html`<div className="md:hidden px-6 pb-4 flex flex-col gap-1">${NAV.map(l=>html`<a key=${l[1]} href=${'#'+l[1]} onClick=${()=>setOpen(false)} className="py-3 text-lg border-t border-line">${l[0]}</a>`)}</div>`}</nav>

<header id="top" className="pt-14 md:pt-24 pb-20"><div className="mx-auto max-w-6xl px-6 grid md:grid-cols-2 gap-12 items-center">
<div className="rise"><p className="text-acc font-medium text-lg">Scientist. Founder. Author.</p>
<h1 className="mt-4 text-6xl sm:text-7xl lg:text-8xl font-semibold tracking-tighter leading-[1.02] grad">Zafar Riza</h1>
<p className="mt-6 text-xl md:text-2xl text-mute max-w-md leading-snug">Designing the future, and empowering the people bold enough to build it.</p>
<div className="mt-9 flex flex-wrap gap-3"><a href="#experience" className="rounded-full px-7 py-3.5 font-semibold text-white bg-acc hover:opacity-90">See my work</a><a href="#contact" className="rounded-full px-7 py-3.5 font-semibold border border-line hover:border-mute">Get in touch</a></div></div>
<div className="relative"><div className="absolute -inset-4 rounded-[3rem] blur-3xl opacity-40" style=${{background:'linear-gradient(135deg,var(--g1),var(--g2),var(--g3))'}} aria-hidden="true"></div>
<img src=${IMG.photo} alt="Portrait of Zafar Riza holding a cup of coffee beside a mountain lake" className="relative w-full rounded-[2rem] object-cover aspect-[4/3] md:aspect-[5/4]"/></div></div></header>

<div className="border-t border-line"><div className="mx-auto max-w-6xl px-6 py-12 grid grid-cols-2 md:grid-cols-4 gap-8">
${[[15,'Age of NASA award for a propulsion theory'],[3,'Published books on Amazon'],[98,'Verified Credly badges'],[68,'Courses completed on Coursera']].map(s=>html`<div key=${s[1]}><p className="text-5xl md:text-6xl font-semibold tracking-tight grad"><${Count} n=${s[0]}/></p><p className="mt-2 text-mute">${s[1]}</p></div>`)}</div></div>

<${Section} id="about" title="Where intelligence, energy and space meet." sub="My mission is to reach the stars. The greatest breakthroughs happen when science meets purpose, and vision is paired with execution.">
<div className="grid gap-4 md:grid-cols-2">${FOCUS.map(f=>html`<div key=${f[0]} className="rounded-3xl bg-panel border border-line p-8"><h3 className="text-2xl font-semibold tracking-tight">${f[0]}</h3><p className="mt-3 text-mute leading-relaxed">${f[1]}</p></div>`)}</div><//>

<${Section} id="experience" title="Experience." sub="NASA programmes, plus virtual experience programs completed online with leading companies.">
<div className="grid gap-4 md:grid-cols-2">${EXP.map(o=>html`<${Org} key=${o.org} o=${o}/>`)}</div><//>

<${Section} id="volunteer" title="Giving back." sub="Volunteering with global and community organizations.">
<div className="grid gap-4 md:grid-cols-3">${VOL.map(o=>html`<${Org} key=${o.org} o=${o}/>`)}</div><//>

<${Section} id="projects" title="Projects and research."><${Projects}/><//>

<${Section} id="zr" title="ZR PRODUCTIONS." sub="Where imagination meets innovation. The company I founded in 2020 and lead as President, working in space research and technology.">
<div className="flex flex-wrap gap-3"><a href="https://sites.google.com/view/zr-technologies/home" target="_blank" rel="noopener" className="rounded-full px-7 py-3.5 font-semibold text-white bg-acc hover:opacity-90">Visit the website</a><a href="https://www.linkedin.com/company/zr-productions/" target="_blank" rel="noopener" className="rounded-full px-7 py-3.5 font-semibold border border-line hover:border-mute">Company page</a></div><//>

<${Section} id="books" title="Ideas in print.">
<div className="grid gap-6 md:grid-cols-3">${BOOKS.map(b=>html`<a key=${b.t} href=${b.u} target="_blank" rel="noopener" className="group rounded-3xl border border-line bg-panel p-6 flex flex-col hover:border-mute transition">
<img src=${b.i} alt=${'Cover of '+b.t} loading="lazy" className="w-full max-w-[240px] mx-auto aspect-[2/3] object-cover rounded-xl shadow-lg"/>
<p className="mt-6 text-sm text-mute">${b.d}</p><h3 className="mt-1 text-xl font-semibold tracking-tight">${b.t}</h3><p className="mt-2 text-mute leading-relaxed flex-1">${b.x}</p>
<span className="mt-5 font-medium text-acc">View on Amazon</span></a>`)}</div><//>

<${Section} id="credentials" title="Certifications and badges." sub="Every verified badge and certificate, searchable by name or issuer."><${Certs}/><//>

<section className="border-t border-line py-20 md:py-28"><div className="mx-auto max-w-6xl px-6"><img src=${IMG.banner} alt="Zafar Riza: scientist, CEO, builder, visionary. Turning knowledge into innovation, and innovation into a better tomorrow." loading="lazy" className="w-full rounded-[2rem] border border-line"/></div></section>

<${Section} id="contact" title="Let\u2019s talk." sub="If you are building something bold in AI, space or deep tech, send me a message."><${Contact}/><//>

<footer className="border-t border-line py-10"><div className="mx-auto max-w-6xl px-6 flex flex-wrap justify-between gap-3 text-sm text-mute"><span>Zafar Riza, President of ZR PRODUCTIONS.</span><span>Where imagination meets innovation.</span></div></footer></div>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
